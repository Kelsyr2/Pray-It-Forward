<div class="container mt-4">

  <h2>Delete Prayer Request</h2>

  <div class="alert alert-warning">
    Are you sure you want to delete this prayer request?
  </div>

  <button
    type="button"
    class="btn btn-danger me-2"
    (click)="deletePrayer()">
    Delete Prayer
  </button>

  <button
    type="button"
    class="btn btn-secondary"
    (click)="cancel()">
    Cancel
  </button>

</div>
